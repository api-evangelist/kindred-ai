name: Kindred Ai
description: >-
  Kindred AI (Kindred Systems) was an artificial-intelligence and robotics
  company that applied reinforcement learning and teleoperation to autonomous
  piece-picking robots for warehouse and retail-fulfillment automation. Founded
  by D-Wave alumni and backed by DCVC among other investors, Kindred was
  acquired by Ocado Group in 2020 and folded into Ocado's advanced-robotics
  operations. It no longer operates an independent public developer surface: the
  kindred.ai brand domain remains under corporate (CSC) DNS with active Google
  Workspace mail, but serves no live homepage, developer portal, documentation,
  or public API. This profile is retained as an enrichment lead surfaced from the
  DCVC portfolio; no OpenAPI, SDK, or hosted API artifacts could be verified.
